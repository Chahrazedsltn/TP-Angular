<div class="carte">
  <h1 class="ville">{{ ville }}</h1>

  <div class="principal">
    <span class="emoji">{{ emoji }}</span>
    <span class="temperature">{{ temperature }}°C</span>
  </div>

  <p class="condition">{{ condition }}</p>

  <div class="details">
    <div class="detail">
      <span class="detail-icon">💧</span>
      <span>Humidité</span>
      <strong>{{ humidite }}%</strong>
    </div>
    <div class="separateur"></div>
    <div class="detail">
      <span class="detail-icon">💨</span>
      <span>Vent</span>
      <strong>{{ vent }} km/h</strong>
    </div>
  </div>
</div>
